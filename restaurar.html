<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Restaurar dados</title>
<meta name="theme-color" content="#14181D">
<style>
  :root{--bg:#14181D;--panel:#1B2129;--line:#2A313B;--text:#EDEFF2;--muted:#8B93A0;--amber:#E8A93B;--teal:#3D8C82;--rose:#C4634F;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding:28px 16px 48px;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:24px;font-weight:650;margin:0 0 8px;}
  p{font-size:14.5px;line-height:1.5;color:var(--muted);margin:0 0 14px;}
  .origin{font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 20px;word-break:break-all;}
  label.file{display:block;text-align:center;padding:15px;border-radius:10px;background:var(--amber);color:#14181D;font-weight:600;font-size:16px;margin:0 0 10px;cursor:pointer;}
  input[type=file]{display:none;}
  textarea{width:100%;min-height:90px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;margin:0 0 10px;}
  .list{border-top:1px solid var(--line);margin:18px 0 20px;}
  .row{display:flex;align-items:center;gap:12px;padding:12px 4px 12px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--teal);font-size:14px;}
  .row.conflito{border-left-color:var(--rose);}
  .row input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--amber);}
  .row .nome{flex:1 1 auto;word-break:break-all;}
  .row .info{flex:0 0 auto;font-size:12px;color:var(--muted);text-align:right;}
  .row.conflito .info{color:var(--rose);}
  button{display:block;width:100%;padding:15px;margin:0 0 10px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;}
  .primary{background:var(--amber);color:#14181D;}
  .secondary{background:var(--panel);color:var(--text);border:1px solid var(--line);}
  button:focus-visible,label.file:focus-within{outline:2px solid var(--text);outline-offset:2px;}
  .msg{font-size:14px;min-height:20px;margin:6px 0 0;color:var(--teal);}
  .msg.erro{color:var(--rose);}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Restaurar dados</h1>
  <p>Escolha o arquivo de backup gerado no endereço antigo. Os dados voltam para os apps deste endereço:</p>
  <div class="origin" id="origin"></div>

  <label class="file">Escolher arquivo de backup<input type="file" id="arquivo" accept=".json,application/json"></label>
  <p>Ou cole o backup copiado:</p>
  <textarea id="colado" placeholder="Cole aqui o texto do backup"></textarea>
  <button class="secondary" id="btnLer">Ler backup colado</button>

  <div id="area" class="hidden">
    <div class="list" id="list"></div>
    <p id="aviso"></p>
    <button class="primary" id="btnRestaurar">Restaurar selecionados</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script>
  document.getElementById('origin').textContent = location.origin;
  const msg = document.getElementById('msg');
  let backup = null;

  function mostrar(texto) {
    msg.className = 'msg';
    msg.textContent = '';
    try {
      const obj = JSON.parse(texto);
      if (!obj || obj.tipo !== 'backup-localstorage' || typeof obj.dados !== 'object') throw 0;
      backup = obj;
    } catch (e) {
      msg.className = 'msg erro';
      msg.textContent = 'Este arquivo não é um backup válido gerado pela página de recuperação.';
      return;
    }
    const list = document.getElementById('list');
    list.innerHTML = '';
    let conflitos = 0;
    Object.keys(backup.dados).sort().forEach(k => {
      const existe = localStorage.getItem(k) !== null;
      if (existe) conflitos++;
      const row = document.createElement('label');
      row.className = 'row' + (existe ? ' conflito' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.dataset.chave = k;
      const nome = document.createElement('span');
      nome.className = 'nome';
      nome.textContent = k;
      const info = document.createElement('span');
      info.className = 'info';
      info.textContent = existe ? 'substitui o atual' : 'novo';
      row.append(cb, nome, info);
      list.appendChild(row);
    });
    document.getElementById('aviso').textContent = conflitos
      ? 'Itens marcados como "substitui o atual" já têm dados aqui. Ao restaurar, os dados atuais desses itens serão trocados pelos do backup. Desmarque o que quiser manter como está.'
      : 'Nenhum conflito: todos os itens serão adicionados.';
    document.getElementById('area').classList.remove('hidden');
  }

  document.getElementById('arquivo').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => mostrar(r.result);
    r.readAsText(f);
  };
  document.getElementById('btnLer').onclick = () => mostrar(document.getElementById('colado').value.trim());

  document.getElementById('btnRestaurar').onclick = () => {
    if (!backup) return;
    const marcados = [...document.querySelectorAll('#list input:checked')].map(c => c.dataset.chave);
    if (!marcados.length) { msg.className = 'msg erro'; msg.textContent = 'Nenhum item selecionado.'; return; }
    if (!confirm('Restaurar ' + marcados.length + ' item(ns)?')) return;
    try {
      marcados.forEach(k => localStorage.setItem(k, backup.dados[k]));
      msg.className = 'msg';
      msg.textContent = 'Dados restaurados. Feche e abra os apps para ver as informações.';
      document.getElementById('area').classList.add('hidden');
    } catch (e) {
      msg.className = 'msg erro';
      msg.textContent = 'Erro ao gravar os dados: ' + e.message;
    }
  };
</script>
</body>
</html>
